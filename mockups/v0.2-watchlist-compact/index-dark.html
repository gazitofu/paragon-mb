<!DOCTYPE html>
<!-- === SECTION: head ===
  PARAGON-MB compact variant v0.2 — index-dark.html
  매체: 정적 HTML/CSS, open file:// 브라우저 프리뷰
  320pt 팝오버 패널 시각 잠금 목업 (SwiftUI 번역 전 레퍼런스)
  다크 모드 강제: <html lang="ko"> — data-theme 없음 = :root 기본(다크)
  v0.1 compact 5축 검증 통과 자산 계승 + 오너 오버라이드 5건 반영
  Plan §11 기준선 정합 (오버라이드 변경분 제외)
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PARAGON-MB — Watchlist compact v0.2 · Dark</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- === SECTION: demo-wrapper ===
  데모 전용 외부 래퍼. 실제 NSPopover에는 .panel 이하만 존재.
  상단 상태 셀렉터로 모든 wireframe 상태를 브라우저에서 토글 가능. -->
<div class="demo-wrapper">

  <p class="demo-label">PARAGON-MB · Watchlist Compact v0.2 · Dark · 상태 셀렉터</p>

  <div class="demo-controls" id="demo-controls" role="toolbar" aria-label="데모 상태 선택"></div>

  <!-- === SECTION: menubar-demo ===
    오너 정제 3: macOS 메뉴바 시뮬레이션 스트립 (데모 크롬 전용)
    실제 NSStatusItem은 팝오버 패널 밖 OS 영역 — 이 스트립은 목업 전용 표현.
    모노크롬 백색 보석(--gem-mono-*): 다크 메뉴바 위 template image 방식.
    라이트 메뉴바에서는 Swift NSImage가 자동 반전(tintColor/template) 처리. -->
  <div class="demo-menubar-panel-group">

    <div class="demo-menubar-strip" aria-hidden="true">
      <span class="demo-menubar-strip-label">macOS menubar · dark · NSStatusItem</span>
      <!-- 모노크롬 보석 아이콘 슬롯 — app.js buildGemMonoSVG()로 렌더 -->
      <div class="menubar-icon-slot" id="menubar-gem-mono"></div>
    </div>

  <!-- === SECTION: panel ===
    320pt 팝오버 패널 본체. 헤더(Z1) + 뷰 콘텐츠(Z2) + 토스트 슬롯.
    compact variant: "+" 버튼 = 헤더 Z1 우측 (Plan §4.3) -->
  <div class="panel" role="main" aria-label="관심종목 패널">

    <!-- Z1 헤더 (sticky) — 오너 정제 2: 1줄 통합 레이아웃
         좌→우: 워드마크 · 장상태+시각"기준" · 배지슬롯 · + 버튼 -->
    <header class="panel-header" id="panel-header">

      <!-- 단일 행: 워드마크(좌) · spacer · [상태텍스트+배지슬롯+"+"버튼](우)
           오너 정제 R2 지시 5: 상태텍스트를 "+" 바로 왼쪽 우측 그룹으로 이동 -->
      <div class="header-row-single">
        <!-- 워드마크 슬롯 — app.js buildWordmark()가 동적 렌더 -->
        <div class="wordmark" id="wordmark-slot" aria-label="PARAGON" role="img"></div>
        <!-- flex spacer: 워드마크와 우측 그룹 사이 공간 확보 -->
        <span class="header-spacer" aria-hidden="true"></span>
        <!-- 우측 그룹: 상태텍스트 + 배지슬롯 + "+" 버튼 -->
        <div class="header-right-group">
          <!-- 통합 상태 텍스트: "장중 14:23:05 기준" / "장마감 종가 기준" -->
          <span class="header-status-text" id="header-status-text" aria-live="polite"></span>
          <!-- 상태 배지 슬롯 (ws-disconnected / token-refreshing / auth-failed) -->
          <span id="header-badge-slot" aria-live="polite"></span>
          <!-- compact "+": 헤더 Z1 우측 (Plan §4.3 compact variant 핵심 차이) -->
          <button
            class="btn-add-header"
            id="btn-add-header"
            aria-label="종목 추가"
            title="종목 추가"
          >+</button>
        </div>
      </div>

    </header>

    <!-- 헤더 인라인 경고/인디케이터 배너 -->
    <div id="header-alert" class="header-alert" role="alert" style="display:none;"></div>

    <!-- === SECTION: view-empty ===
      W1 — 빈 상태 (wireframe §3 W1 SSOT) -->
    <div class="view" id="view-empty" role="region" aria-label="빈 상태">
      <div class="empty-state">
        <!-- 보석 마크 아이콘 — 브랜드 일관성 (오너 오버라이드 2 권장사항) -->
        <div class="empty-icon" id="empty-gem-icon" aria-hidden="true"></div>
        <p class="empty-message">아직 등록된 종목이 없습니다</p>
        <button
          class="btn-empty-cta"
          id="btn-empty-cta"
        >+ 종목 추가</button>
      </div>
    </div>

    <!-- === SECTION: view-list ===
      W2 — 목록 뷰 (wireframe §3 W2 SSOT) -->
    <div class="view" id="view-list" role="region" aria-label="관심종목 목록">
      <div
        class="symbol-list"
        id="symbol-list-container"
        role="list"
        aria-label="관심종목"
      ></div>
    </div>

    <!-- === SECTION: view-add ===
      W3 — 종목 등록 폼 (wireframe §3 W3 SSOT) -->
    <div class="view" id="view-add" role="region" aria-label="종목 추가">
      <div class="add-form-view">
        <div class="add-form-field">
          <label class="add-form-label" for="add-input">종목코드</label>
          <input
            class="add-form-input"
            id="add-input"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="예: 005930"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            aria-describedby="add-error"
          />
          <span
            class="add-form-error"
            id="add-error"
            role="alert"
            aria-live="assertive"
          ></span>
        </div>

        <div class="add-form-actions">
          <button
            class="btn-submit"
            id="btn-submit"
            type="button"
          >
            <span class="btn-submit-inner">
              <span class="btn-spinner" aria-hidden="true"></span>
              <span class="btn-label">등록</span>
            </span>
          </button>
          <button
            class="btn-cancel"
            id="btn-cancel"
            type="button"
          >취소</button>
        </div>
      </div>
    </div>

    <!-- === SECTION: toast-slot ===
      삭제 토스트 슬롯 — 패널 하단 고정 (Plan §5.4) -->
    <div class="toast-slot" id="toast-slot" aria-live="polite"></div>

  </div><!-- /.panel -->
  </div><!-- /.demo-menubar-panel-group -->

</div><!-- /.demo-wrapper -->

<script src="app.js"></script>
<!-- 보석 아이콘 초기화는 app.js initWordmark()에서 처리 -->
</body>
</html>
