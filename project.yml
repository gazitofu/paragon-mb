name: PARAGON-MB
# 앱 타깃 정의 SSOT — `xcodegen generate`로 PARAGON-MB.xcodeproj 결정적 생성.
# PMCore(루트 Package.swift)는 로컬 SwiftPM 패키지로 의존. 런타임 외부 의존성 0.
options:
  bundleIdPrefix: kr.co.paragon
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  PMCore:
    path: .

targets:
  PARAGON-MB:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: PMCore
        product: PMCore
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true            # Dock 미표시 — 메뉴바 상주 (architecture.md §빌드 형식)
        CFBundleDisplayName: PARAGON   # 사용자 노출 앱명 = PARAGON (PARAGON-MB는 프로젝트/번들ID명)
        CFBundleName: PARAGON
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSExceptionDomains:
            ops.koreainvestment.com:
              NSExceptionAllowsInsecureHTTPLoads: true  # KIS WS 평문 ws:// — wss TLS 실패 실측(API_SPEC §WS)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.paragon.paragon-mb
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual       # 안정적 Development 서명(B1) — DR 고정 → keychain "Always Allow" 영구 지속 (handoff §keychain/서명). ad-hoc("-")은 빌드마다 cdhash 변동으로 재프롬프트 유발했음.
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: F29HVM9355  # 무료 Personal Team (jinhyung_park@outlook.com). macOS 로컬 개발은 provisioning profile 불요 — Development cert 직접 서명.
        ENABLE_HARDENED_RUNTIME: NO
        DEAD_CODE_STRIPPING: YES

  PARAGON-MBTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: PARAGON-MB
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PARAGON-MB.app/Contents/MacOS/PARAGON-MB"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: F29HVM9355
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PARAGON-MB:
    build:
      targets:
        PARAGON-MB: all
        PARAGON-MBTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PARAGON-MBTests
    profile:
      config: Release
    archive:
      config: Release
